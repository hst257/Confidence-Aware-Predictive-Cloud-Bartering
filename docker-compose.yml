services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud_barter
      POSTGRES_USER: cloud_barter
      POSTGRES_PASSWORD: cloud_barter
    ports:
      # Use a dedicated host port so the prototype can coexist with a locally
      # installed PostgreSQL service, which commonly occupies 5432.
      - "55432:5432"
    volumes:
      - cloud-barter-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_barter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloud-barter-data:
